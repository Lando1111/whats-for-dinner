name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This pings the API twice a week.
on:
  schedule:
    - cron: '17 21 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://tfhwvccqmwtbrhqqfcdn.supabase.co/rest/v1/households?select=id&limit=1" \
            -H "apikey: sb_publishable_TZH41kWfkyiUkPkrFUviwA_Ba1VYOqS" -o /dev/null -w "%{http_code}\n"
